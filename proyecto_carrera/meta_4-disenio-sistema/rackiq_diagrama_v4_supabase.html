
<style>

    subgraph D2["🐳 Docker 2"]
      EDGESVC["Edge Service\\nPython · FastAPI\\nstore & forward R03\\nfiltrado ruido · debounce F12"]

      SQLITE["SQLite\\nbuffer offline R01 R02"]

document.getElementById('arch').innerHTML = svg;
</script>
