
<style>
  body { margin: 0; }
  #wrap { width: 100%; overflow-x: auto; }
  #wrap svg { min-width: 900px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 8px 0 4px; font-size: 12px; color: var(--color-text-secondary); }
  .leg-item { display: flex; align-items: center; gap: 6px; }
  .leg-dot { width: 12px; height: 12px; border-radius: 3px; }
</style>
<div class="legend">
  <span class="leg-item"><span class="leg-dot" style="background:#CECBF6"></span>Organización / Usuarios</span>
  <span class="leg-item"><span class="leg-dot" style="background:#9FE1CB"></span>Hardware / Sensores</span>
  <span class="leg-item"><span class="leg-dot" style="background:#FAC775"></span>Auditoría / Mermas</span>
  <span class="leg-item"><span class="leg-dot" style="background:#F5C4B3"></span>Proveedores / Compras</span>
  <span class="leg-item"><span class="leg-dot" style="background:#B5D4F4"></span>Analítica / Reportes</span>
</div>
<div id="wrap"><div id="erd"></div></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a28' : '#f1efe8',
    primaryBorderColor: dark ? '#5f5e5a' : '#b4b2a9',
    primaryTextColor: dark ? '#c2c0b6' : '#3d3d3a',
    edgeLabelBackground: dark ? '#1e1e1c' : '#ffffff',
  },
});

const diagram = `classDiagram
  %% ── ORGANIZACIÓN ──
  class Organization {
    +UUID id PK
    +String name
    +String slug
    +String plan_type
    +Timestamp created_at
  }
  class Branch {
    +UUID id PK
    +UUID organization_id FK
    +String name
    +String address
    +String timezone
    +Boolean is_active
  }
  class User {
    +UUID id PK
    +UUID organization_id FK
    +String email
    +String name
    +String role
    +String push_token
  }
  class StoreHours {
    +UUID id PK
    +UUID branch_id FK
    +Int day_of_week
    +Time open_time
    +Time close_time
  }

  %% ── CATÁLOGO ──
  class Product {
    +UUID id PK
    +UUID organization_id FK
    +String name
    +String sku
    +Float unit_weight_grams
    +Float cost_price
    +Float sale_price
  }

  %% ── HARDWARE ──
  class ESP32Node {
    +UUID id PK
    +UUID branch_id FK
    +String mac_address
    +String firmware_version
    +Timestamp last_heartbeat_at
    +Boolean is_online
    +Float wifi_rssi
  }
  class Shelf {
    +UUID id PK
    +UUID branch_id FK
    +UUID product_id FK
    +UUID esp32_node_id FK
    +String name
    +Int hx711_channel
    +Float tare_weight_grams
    +Float scale_factor
    +Float max_capacity_grams
    +Float low_stock_threshold_pct
    +Float low_stock_threshold_kg
    +String alert_mode
    +Timestamp last_calibrated_at
    +Boolean is_active
  }
  class WeightReading {
    +UUID id PK
    +UUID shelf_id FK
    +Float raw_weight_grams
    +Float net_weight_grams
    +Timestamp recorded_at
  }
  class StockEvent {
    +UUID id PK
    +UUID shelf_id FK
    +String event_type
    +Float weight_delta_grams
    +Float units_delta
    +Float weight_before
    +Float weight_after
    +Timestamp occurred_at
    +Boolean is_consolidated
  }

  %% ── ALERTAS ──
  class Alert {
    +UUID id PK
    +UUID shelf_id FK
    +UUID branch_id FK
    +String alert_type
    +String status
    +JSONB metadata
    +Timestamp triggered_at
    +Timestamp resolved_at
    +UUID resolved_by FK
  }
  class AnomalyEvent {
    +UUID id PK
    +UUID shelf_id FK
    +String anomaly_type
    +Float weight_delta_grams
    +Float rate_per_minute
    +Boolean out_of_hours
    +String status
    +Timestamp detected_at
  }

  %% ── AUDITORÍA ──
  class InventoryAudit {
    +UUID id PK
    +UUID branch_id FK
    +UUID created_by FK
    +Timestamp period_start
    +Timestamp period_end
    +String status
    +Timestamp closed_at
  }
  class AuditLine {
    +UUID id PK
    +UUID audit_id FK
    +UUID shelf_id FK
    +Float sensor_units_out
    +Float pos_units_sold
    +Float discrepancy_units
    +String resolution_type
    +UUID resolved_by FK
    +Timestamp resolved_at
  }

  %% ── PROVEEDORES ──
  class Supplier {
    +UUID id PK
    +UUID organization_id FK
    +String name
    +String contact_email
    +String api_endpoint
  }
  class PurchaseOrder {
    +UUID id PK
    +UUID shelf_id FK
    +UUID supplier_id FK
    +String trigger_type
    +Float quantity_kg
    +String status
    +Timestamp created_at
    +Timestamp sent_at
  }
  class SupplierReceipt {
    +UUID id PK
    +UUID shelf_id FK
    +UUID created_by FK
    +Float declared_weight_grams
    +Float measured_weight_grams
    +Float discrepancy_grams
    +String status
    +Timestamp received_at
  }

  %% ── ANALÍTICA ──
  class SeasonalPattern {
    +UUID id PK
    +UUID product_id FK
    +UUID branch_id FK
    +Int week_of_year
    +Int day_of_week
    +Float avg_sales_units
    +Float confidence_score
  }
  class BusinessReport {
    +UUID id PK
    +UUID branch_id FK
    +String report_type
    +Timestamp period_start
    +Timestamp period_end
    +JSONB payload
    +String format
    +String status
  }

  %% ── RELACIONES ──
  Organization "1" --> "0..*" Branch : tiene
  Organization "1" --> "0..*" User : pertenece
  Organization "1" --> "0..*" Product : gestiona
  Organization "1" --> "0..*" Supplier : trabaja con

  Branch "1" --> "0..*" ESP32Node : aloja
  Branch "1" --> "0..*" Shelf : contiene
  Branch "1" --> "0..*" StoreHours : define
  Branch "1" --> "0..*" Alert : genera
  Branch "1" --> "0..*" InventoryAudit : realiza
  Branch "1" --> "0..*" BusinessReport : produce

  ESP32Node "1" --> "0..*" Shelf : monitorea
  Product "1" --> "0..*" Shelf : asignado a
  Product "1" --> "0..*" SeasonalPattern : aprende
  Branch "1" --> "0..*" SeasonalPattern : aplica

  Shelf "1" --> "0..*" WeightReading : registra
  Shelf "1" --> "0..*" StockEvent : genera
  Shelf "1" --> "0..*" Alert : dispara
  Shelf "1" --> "0..*" AnomalyEvent : detecta
  Shelf "1" --> "0..*" AuditLine : auditado en
  Shelf "1" --> "0..*" PurchaseOrder : origina
  Shelf "1" --> "0..*" SupplierReceipt : recibe en

  InventoryAudit "1" --> "0..*" AuditLine : contiene
  Supplier "1" --> "0..*" PurchaseOrder : recibe

  User "1" --> "0..*" InventoryAudit : crea
  User "1" --> "0..*" AuditLine : resuelve
  User "1" --> "0..*" SupplierReceipt : registra
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;
</script>
